[phases.setup]
nixPkgs = ['php84', 'php84Packages.composer', 'nodejs_22']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader --no-interaction',
    'npm ci',
    'npm run build'
]

[phases.build]
cmds = ['bash railway-deploy.sh']

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=$PORT'
